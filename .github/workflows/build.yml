name: build

on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
  workflow_dispatch:

# 只读权限足够；发布 crates.io 用的是 secrets 里的 token
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

# 同一分支/标签有新的运行时就取消旧的
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 快速反馈：格式 + lint + 测试（所有事件都跑）
  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Format
        run: cargo fmt --all --check

      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Test
        run: cargo test

  # 三平台产物：只在打标签或手动触发时构建
  build:
    name: build (${{ matrix.target }})
    needs: test
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive: varstat-linux.tar.gz
          - os: macos-latest
            target: x86_64-apple-darwin
            archive: varstat-macos.tar.gz
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            archive: varstat-windows.7z
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2

      - name: Install musl tools
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        run: |
          mkdir -p archive
          cp README.md archive/
          cd archive
          if [ "${{ matrix.target }}" = "x86_64-pc-windows-msvc" ]; then
            cp "../target/${{ matrix.target }}/release/varstat.exe" .
            7z a "${{ matrix.archive }}" README.md varstat.exe
          else
            cp "../target/${{ matrix.target }}/release/varstat" .
            strip varstat
            tar -czf "${{ matrix.archive }}" README.md varstat
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.archive }}
          path: archive/${{ matrix.archive }}

  # 打标签时发布到 crates.io（标签版本必须与 Cargo.toml 一致）
  publish-crate:
    name: publish to crates.io
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "tag=v$tag, Cargo.toml version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::标签 v$tag 与 Cargo.toml 中的版本 $version 不一致"
            exit 1
          fi

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish
