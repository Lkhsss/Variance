name: build
on:
  workflow_dispatch: {}
  # 推送形如 v1.2.3 的标签时触发构建与发布
  push:
    tags:
      - 'v*.*.*'
jobs:
  build:
    name: build
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        build: [linux, macos, windows]
        include:
          - build: linux
            os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            archive-name: variance-linux.tar.gz
          - build: macos
            os: macos-latest
            target: macos-latest
            archive-name: variance-macos.tar.gz
          - build: windows
            os: windows-latest
            target: x86_64-pc-windows-msvc
            archive-name: variance-windows.7z

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: stable
          target: ${{ matrix.target }}

      - name: Build binary
        run: cargo build --verbose --release --target ${{ matrix.target }}
        env:
          RUST_BACKTRACE: 1

      - name: Strip binary (linux and macos)
        if: matrix.build == 'linux' || matrix.build == 'macos'
        run: strip "target/${{ matrix.target }}/release/variance"

      - name: Build archive
        shell: bash
        run: |
          mkdir archive
          # cp LICENSE README.md archive/
          cp README.md archive/
          cd archive
          if [ "${{ matrix.build }}" = "windows" ]; then
            cp "../target/${{ matrix.target }}/release/variance.exe" ./
            # 7z a "${{ matrix.archive-name }}" LICENSE README.md variance.exe
            7z a "${{ matrix.archive-name }}" README.md variance.exe
          else
            cp "../target/${{ matrix.target }}/release/variance" ./
            # tar -czf "${{ matrix.archive-name }}" LICENSE README.md variance
            tar -czf "${{ matrix.archive-name }}" README.md variance
          fi
      - name: Upload archive
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.archive-name }}
          path: archive/${{ matrix.archive-name }}
  publish-crate:
    name: Publish to crates.io
    # 仅在推送 v* 标签时发布，避免手动触发时因版本已存在而失败
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v7

      - uses: dtolnay/rust-toolchain@stable

      - name: Check tag matches Cargo.toml version
        shell: bash
        run: |
          tag="${GITHUB_REF_NAME#v}"
          version="$(sed -n 's/^version = "\(.*\)"$/\1/p' Cargo.toml | head -n 1)"
          echo "tag=v$tag, Cargo.toml version=$version"
          if [ "$tag" != "$version" ]; then
            echo "::error::标签 v$tag 与 Cargo.toml 中的版本 $version 不一致"
            exit 1
          fi

      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_API_TOKEN }}
        run: cargo publish
